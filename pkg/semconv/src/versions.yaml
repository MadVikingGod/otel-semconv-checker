# How to generate these files:
# 1 Checkout the opentelemetry/semantic-convention repository at the particular version
# 2 Use the weaver project and yq to generate the json files         v This is because weaver adds a few lines to std out
# weaver registry resolve -r ../semantic-conventions/model -f yaml | tail -n +4 | yq '.groups | map({(.id): .| {"Id":.id, "Attributes":[.attributes[] | {"CanonicalId": .name}]|sort}})  | add' -Sc > v1.26.0.json
